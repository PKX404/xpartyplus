<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dfff35"><title>XParty+</title><link rel="stylesheet" href="/style.css"></head><body><div id="ambient"></div><main><header><div class="logo"><i>X</i><b>PARTY<span>+</span></b></div><small>Crafted by PKX404</small></header><section id="home" class="card hero"><div class="love">Made4Love ❤️<em>Aanchal</em></div><h1>Watch. Talk. Feel the same moment.</h1><p>Create a private room for synchronized video, conversation and a fluid media-first experience.</p><input id="name" placeholder="Nickname (optional)"><button id="create">Create Room</button><div class="join"><input id="code" placeholder="XPXX-XXX"><button id="join">Join</button></div></section><section id="room" hidden><div class="top"><b id="roomCode"></b><span id="presence"></span></div><div class="stage"><div id="player"><div id="waiting">Waiting for a video</div></div></div><div class="tools"><button title="Focus"><span>⌕</span>_</button><button title="Call">_</button><button title="Chat">_</button><button title="Room">_</button></div><div class="load"><input id="yt" placeholder="Paste YouTube URL or video ID"><button id="load">Load</button></div><div class="controls"><button id="play">▶</button><button id="pause">Ⅱ</button><button id="sync">Sync</button></div><aside><div id="messages"></div><form id="chat"><input id="msg" placeholder="Message"><button>Send</button></form></aside></section></main><div id="cookie"><b>XParty+ uses essential room data</b><p>Required for room identity and synchronized sessions.</p><button id="accept">Accept & continue</button></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
